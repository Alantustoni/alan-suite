[project]
name = "alan-suite"
version = "2.9.0"
description = "Ferramentas desktop de contas a pagar: CNAB240, retorno SISPAG, DDA e conciliação remessa x banco"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alan Tustoni" }]
requires-python = ">=3.13"
dependencies = [
    "customtkinter>=5.2",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "numpy>=1.24",
    "rapidfuzz>=3.0",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# os testes do motor DDA vendorizado também entram na suíte
python_files = ["test_*.py", "vendor_test_*.py"]
